<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f6fa"/>
      <stop offset="100%" stop-color="#dce8f1"/>
    </linearGradient>
    <linearGradient id="brand2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#285c7d"/>
      <stop offset="100%" stop-color="#4785a3"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#24465d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>
  <circle cx="120" cy="90" r="120" fill="#4785a3" opacity="0.05"/>
  <circle cx="700" cy="520" r="140" fill="#719db5" opacity="0.06"/>

  <text x="64" y="84" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#24465d">Hybrid Search Strategy</text>
  <text x="64" y="116" font-family="Arial, sans-serif" font-size="15" fill="#285c7d">Keyword + vector semantics + knowledge graph, fused for the best result</text>

  <g filter="url(#soft2)">
    <rect x="64" y="148" width="672" height="396" rx="20" fill="#FFFFFF"/>
  </g>

  <!-- BM25 -->
  <g transform="translate(96, 184)">
    <rect width="184" height="220" rx="14" fill="#f3f6f8" stroke="#b1c4d2" stroke-width="1.5"/>
    <rect width="184" height="48" rx="14" fill="#e2ebf2"/>
    <rect y="34" width="184" height="14" fill="#e2ebf2"/>
    <text x="92" y="31" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#35566d" text-anchor="middle">BM25 Keyword</text>
    <g font-family="Arial, sans-serif" font-size="12.5" fill="#47657b">
      <rect x="20" y="70" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#c5d7e4"/><text x="92" y="90" text-anchor="middle">TF-IDF weights</text>
      <rect x="20" y="110" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#c5d7e4"/><text x="92" y="130" text-anchor="middle">Term frequency</text>
      <rect x="20" y="150" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#c5d7e4"/><text x="92" y="170" text-anchor="middle">Exact match</text>
    </g>
    <text x="92" y="206" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#52788f" text-anchor="middle">Strong on terms</text>
  </g>

  <!-- Vector -->
  <g transform="translate(308, 184)">
    <rect width="184" height="220" rx="14" fill="#edf3f8" stroke="#a7c3d8" stroke-width="1.5"/>
    <rect width="184" height="48" rx="14" fill="#dce9f3"/>
    <rect y="34" width="184" height="14" fill="#dce9f3"/>
    <text x="92" y="31" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2c5878" text-anchor="middle">Vector Semantic</text>
    <g font-family="Arial, sans-serif" font-size="12.5" fill="#3c627e">
      <rect x="20" y="70" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#bfd3e2"/><text x="92" y="90" text-anchor="middle">Embedding</text>
      <rect x="20" y="110" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#bfd3e2"/><text x="92" y="130" text-anchor="middle">Cosine similarity</text>
      <rect x="20" y="150" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#bfd3e2"/><text x="92" y="170" text-anchor="middle">ANN search</text>
    </g>
    <text x="92" y="206" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#3d6f91" text-anchor="middle">Understands meaning</text>
  </g>

  <!-- Graph -->
  <g transform="translate(520, 184)">
    <rect width="184" height="220" rx="14" fill="#edf3f7" stroke="#9fbcd0" stroke-width="1.5"/>
    <rect width="184" height="48" rx="14" fill="#dce8f1"/>
    <rect y="34" width="184" height="14" fill="#dce8f1"/>
    <text x="92" y="31" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#24465d" text-anchor="middle">Knowledge Graph</text>
    <g font-family="Arial, sans-serif" font-size="12.5" fill="#264c60">
      <rect x="20" y="70" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#c5d7e4"/><text x="92" y="90" text-anchor="middle">Entity recognition</text>
      <rect x="20" y="110" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#c5d7e4"/><text x="92" y="130" text-anchor="middle">Relation paths</text>
      <rect x="20" y="150" width="144" height="30" rx="8" fill="#FFFFFF" stroke="#c5d7e4"/><text x="92" y="170" text-anchor="middle">Subgraph match</text>
    </g>
    <text x="92" y="206" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#285c7d" text-anchor="middle">Reasons over links</text>
  </g>

  <g stroke="#4785a3" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M188 412 V446 H400 V470" marker-end="url(#arr2)"/>
    <path d="M400 412 V470" marker-end="url(#arr2)"/>
    <path d="M612 412 V446 H400" />
  </g>

  <g transform="translate(220, 478)">
    <rect width="360" height="50" rx="14" fill="url(#brand2)" filter="url(#soft2)"/>
    <text x="180" y="31" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">RRF fusion ranking -&gt; best result</text>
  </g>

  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#4785a3"/>
    </marker>
  </defs>
</svg>
