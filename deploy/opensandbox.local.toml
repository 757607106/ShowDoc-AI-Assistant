# Derived from Apache-2.0 OpenSandbox server example.config.toml, release 1.2.1.
# Local development only; hardened Linux/Kata acceptance is a separate step.
[server]
host = "0.0.0.0"
port = 8090
max_sandbox_timeout_seconds = 3600
[proxy]
resolve_internal = true
[runtime]
type = "docker"
execd_image = "opensandbox/execd:release-1.2.1"
[storage]
allowed_host_paths = ["/__opensandbox_host_mounts_disabled__"]
[store]
type = "postgresql"
[docker]
network_mode = "bridge"
# The trusted controller runs in Docker; host-published health ports live on macOS.
host_ip = "host.docker.internal"
publish_host = "127.0.0.1"
# Keep the official range: a very narrow range increases Docker-host port collisions.
port_range_min = 40000
port_range_max = 60000
drop_capabilities = ["ALL"]
no_new_privileges = true
pids_limit = 128
seccomp_profile = ""
[ingress]
mode = "direct"
[egress]
image = "opensandbox/egress:release-1.2.1"
mode = "dns+nft"
readiness_timeout_seconds = 30.0
[renew_intent]
enabled = false
